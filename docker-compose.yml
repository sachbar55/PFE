version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    container_name: pfe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pfe_assurance}
      POSTGRES_USER: ${POSTGRES_USER:-pfe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfe_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pfe-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    image: node:20-alpine
    container_name: pfe-backend
    working_dir: /app
    command: sh -c "npm install && npm run start --workspace backend"
    environment:
      PORT: ${BACKEND_PORT:-3000}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-change-me-in-production}
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    container_name: pfe-frontend
    working_dir: /app
    command: sh -c "npm install && npm run start --workspace frontend"
    environment:
      PORT: ${FRONTEND_PORT:-5173}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
